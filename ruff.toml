target-version = "py312"
src = ["fpv_labs/src"]
extend-exclude = [".pydeps", ".sitl"]

[lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # порядок імпортів
    "N",            # іменування
    "UP",           # застарілий синтаксис
    "ANN",          # анотації типів обов'язкові
    "B",            # типові помилки
    "A",            # перекриття вбудованих імен
    "C4",           # спискові вирази
    "RET",          # return
    "SIM",          # спрощення
    "ARG",          # невикористані аргументи
    "PL",           # pylint
    "TRY",          # винятки
    "BLE",          # except Exception
    "RUF",
]
ignore = [
    "PLR0913",  # обробники мають багато параметрів з типовими значеннями
    "TRY003",   # текст помилки пишемо там, де вона виникає
    "PLR2004",  # числа в лабораторних файлах - параметри варіанта
    "RUF001", "RUF002", "RUF003",  # кирилиця в рядках і коментарях
]
